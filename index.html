<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>QWALITY SCREEN PRINTING</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
scroll-behavior:smooth;
}

body{
background:#050505;
color:white;
}

/* NAVBAR */

nav{
display:flex;
justify-content:space-between;
align-items:center;
padding:20px 8%;
background:#0b0b0b;
position:sticky;
top:0;
z-index:1000;
border-bottom:1px solid #00ffcc33;
}

nav h1{
font-size:28px;
color:#00ffcc;
text-shadow:0 0 15px #00ffcc88;
}

nav ul{
display:flex;
gap:25px;
list-style:none;
}

nav ul li a{
text-decoration:none;
color:white;
font-weight:bold;
transition:0.3s;
}

nav ul li a:hover{
color:#00aaff;
}

/* HERO */

.hero{
height:90vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
padding:20px;
background:linear-gradient(to bottom,#000,#071520);
}

.hero h2{
font-size:65px;
color:#00ffcc;
text-shadow:0 0 25px #00ffcc88;
}

.hero p{
margin-top:20px;
font-size:20px;
max-width:700px;
color:#ccc;
line-height:1.6;
}

.btn{
display:inline-block;
margin-top:30px;
padding:15px 35px;
border-radius:12px;
text-decoration:none;
font-weight:bold;
background:linear-gradient(45deg,#00ffcc,#00aaff);
color:black;
transition:0.3s;
}

.btn:hover{
transform:scale(1.05);
box-shadow:0 0 20px #00ffcc;
}

/* SERVICES */

.services{
padding:80px 8%;
}

.section-title{
text-align:center;
font-size:45px;
margin-bottom:50px;
color:#00ffcc;
}

.service-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:25px;
}

.card{
background:#0b0b0b;
padding:30px;
border-radius:20px;
border:1px solid #00ffcc33;
transition:0.3s;
}

.card:hover{
transform:translateY(-8px);
box-shadow:0 0 25px #00aaff44;
}

.card h3{
margin-bottom:15px;
font-size:28px;
color:#00aaff;
}

.card p{
color:#ccc;
line-height:1.6;
}

/* CONTACT */

.contact{
padding:80px 8%;
text-align:center;
background:#0b0b0b;
margin-top:50px;
}

.contact h2{
font-size:45px;
margin-bottom:20px;
color:#00ffcc;
}

.contact p{
font-size:18px;
color:#ccc;
margin-bottom:20px;
}

/*
